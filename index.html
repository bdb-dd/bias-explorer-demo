<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bias Explorer Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 15% 10%, rgba(186,45,11,0.10), transparent 60%),
                  radial-gradient(1000px 700px at 85% 20%, rgba(27,73,101,0.12), transparent 60%),
                  #F7F5F0;
      color: #2B2D42;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid rgba(27,73,101,0.35); outline-offset: 4px; border-radius: 14px; }

    .wrap {
      max-width: 520px;
      text-align: center;
      padding: 56px 28px 72px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(43,45,66,0.70);
      margin-bottom: 20px;
    }

    .bars { display: inline-flex; gap: 6px; }
    .bar { width: 26px; height: 4px; border-radius: 2px; }
    .bar.red { background: #BA2D0B; }
    .bar.blue { background: #1B4965; }

    h1 {
      font-family: "Fraunces", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 36px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 15px;
      line-height: 1.7;
      color: rgba(43,45,66,0.60);
      font-weight: 300;
      margin-bottom: 36px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .lang-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(232,228,221,1);
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .lang-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(0,0,0,0.10);
      border-color: rgba(27,73,101,0.22);
    }

    .flag { font-size: 32px; margin-bottom: 4px; }

    .lang-name {
      font-family: "Fraunces", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .lang-sub {
      font-size: 12px;
      color: rgba(43,45,66,0.55);
      font-weight: 300;
    }

    @media (max-width: 480px) {
      .lang-grid { grid-template-columns: 1fr; }
      h1 { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lang-card { transition: none; }
      .lang-card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">
      <span class="bars" aria-hidden="true">
        <span class="bar red"></span>
        <span class="bar blue"></span>
      </span>
      Bias Explorer Demo
    </div>
    <h1>Choose language</h1>
    <p class="sub">Select your preferred language to explore the demos.</p>

    <div class="lang-grid">
      <a class="lang-card" href="en/index.html">
        <span class="flag" aria-hidden="true">&#x1F1EC;&#x1F1E7;</span>
        <span class="lang-name">English</span>
        <span class="lang-sub">View in English</span>
      </a>

      <a class="lang-card" href="no/index.html">
        <span class="flag" aria-hidden="true">&#x1F1F3;&#x1F1F4;</span>
        <span class="lang-name">Norsk</span>
        <span class="lang-sub">Vis p&aring; norsk</span>
      </a>
    </div>
  </div>
</body>
</html>
